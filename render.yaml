# Render Blueprint — ECDAT (main branch)
# https://dashboard.render.com/blueprints
#
# Scans/users live in PostgreSQL (DATABASE_URL). Do not use SQLite here — Render’s
# filesystem is ephemeral and SQLite files are wiped on deploy/restart.
# Alternative: set DATABASE_URL in the Dashboard to your Supabase DB URI instead
# of using fromDatabase below (same Postgres, visible in Supabase Table Editor).

databases:
  - name: ecdat-db
    plan: free
    region: oregon

services:
  - type: web
    name: ecdat-api
    runtime: python
    branch: main
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt && python scanner/scripts/build_corpus_zips.py
    startCommand: cd backend && PYTHONPATH=.:.. uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecdat-db
          property: connectionString
      - key: SYNC_SCAN
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        sync: false
        value: https://ecdat-frontend.onrender.com,https://ecdat-zeta.vercel.app,http://localhost:3000
      - key: AI_NARRATION_ENABLED
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_CONTEXT_ARTEFACT_LIMIT
        value: "40"

  - type: web
    name: ecdat-frontend
    runtime: node
    branch: main
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
        value: https://ecdat-api-iqgx.onrender.com
