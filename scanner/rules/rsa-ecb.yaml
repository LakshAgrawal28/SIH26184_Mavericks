# ECDAT Semgrep Rule — RSA ECB Mode (Textbook RSA)
# ECB mode for RSA is equivalent to textbook RSA — no semantic security.
rules:
  - id: java-rsa-ecb-pkcs1
    patterns:
      - pattern: Cipher.getInstance("RSA/ECB/PKCS1Padding")
      - pattern: Cipher.getInstance("RSA/ECB/NoPadding")
      - pattern: Cipher.getInstance("RSA/ECB/OAEPWithSHA-1AndMGF1Padding")
    message: |
      RSA/ECB mode is quantum-vulnerable (Shor's algorithm). 
      Migrate to ML-KEM-768 (NIST FIPS 203) with X25519MLKEM768 hybrid for TLS.
    languages: [java]
    severity: ERROR
    metadata:
      category: cryptography
      quantum_risk: CRITICAL
      cwe: CWE-327
      nist_standard: "NIST FIPS 203"
      pqc_action: "Hybrid Migration → X25519MLKEM768"

  - id: java-rsa-keygen
    pattern: KeyPairGenerator.getInstance("RSA")
    message: "RSA key generation is quantum-vulnerable. Migrate to ML-KEM-768 or ML-DSA-65."
    languages: [java]
    severity: WARNING
    metadata:
      category: cryptography
      quantum_risk: HIGH
      cwe: CWE-327
      nist_standard: "NIST FIPS 203 / FIPS 204"
      pqc_action: "Hybrid Migration → ML-KEM-768 or ML-DSA-65"
